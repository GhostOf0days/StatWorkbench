<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'"><title>Book1 — StatWorkbench</title><link rel="icon" type="image/png" href="../assets/statworkbench.png"><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="browser-title"><span id="document-title">Book1 — StatWorkbench</span><span id="dirty-marker"></span></div>
<nav id="app-menu" aria-label="Application menu"></nav>
<header class="category-toolbar" aria-label="Analysis toolbar"><div class="zoom-item"><select id="zoom" aria-label="Zoom"><option>50%</option><option>75%</option><option selected>100%</option><option>125%</option><option>150%</option><option>200%</option></select><span>Zoom</span></div><div id="category-buttons"></div></header>
<nav id="quick-access" aria-label="Quick Access Toolbar" hidden></nav>
<div class="formula-bar"><input id="cell-address" aria-label="Selected range" value="A1" readonly><span class="formula-divider">⋮</span><input id="formula-value" aria-label="Formula or cell value" spellcheck="false"></div>
<main class="workbook-workspace"><div id="spreadsheet" aria-label="Workbook"></div><aside id="side-panel" hidden><div class="panel-title"><strong id="panel-heading"></strong><button id="panel-close" aria-label="Close panel">×</button></div><div id="panel-body"></div></aside></main>
<footer class="app-status"><span id="status" role="status">Starting…</span><span id="selection-status"></span></footer>
<div id="dropdown" class="native-menu" role="menu" hidden></div>
<dialog id="analysis-dialog" class="analysis-dialog"><form id="analysis-form"><header class="dialog-title"><span id="analysis-title">Analysis</span><button id="analysis-close" aria-label="Close" type="button">×</button></header><div class="analysis-location">Spreadsheet: <span id="analysis-source">Built-in</span> <span>❯</span> <span id="analysis-workbook">Untitled</span></div><section class="analysis-inputs"><aside class="variables-browser"><label for="analysis-sheet">Sheet</label><select id="analysis-sheet"></select><label for="variable-list">Variables/Columns</label><select multiple id="variable-list" aria-label="Variables and columns"></select><label class="check-label"><input type="checkbox" id="labels-first-row" checked>Labels In First Row</label></aside><div class="parameter-area"><div id="range-fields"></div><div id="parameter-fields"></div></div></section><section class="advanced-options"><div class="advanced-heading"><span>Advanced Options</span><button id="reset-options" type="button">Reset to Defaults</button></div><div id="option-tabs" role="tablist"></div><div id="option-fields"></div></section><div id="analysis-error" class="error-message" role="alert" hidden></div><div class="analysis-description"><span class="info-symbol">i</span><span id="analysis-description"></span></div><footer class="analysis-footer"><button id="preferences" type="button">Preferences</button><button id="analysis-help" type="button">Help</button><span class="spacer"></span><button id="cancel-analysis" type="button">Cancel</button><button id="run-analysis" class="default-button" type="submit">OK</button></footer></form></dialog>
<dialog id="utility-dialog"><div id="utility-content"></div></dialog>
<div id="range-selection-bar" hidden><span>Select a range in the worksheet, then click Return.</span><button id="range-selection-return">Return to analysis</button><button id="range-selection-cancel">Cancel</button></div>
<div id="toast" hidden role="alert"></div>
<script type="module" src="app.js"></script>
</body></html>
